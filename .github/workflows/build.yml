name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          unzip -o semester_planner.zip
          if [ -d "semester_planner" ]; then
            cp -r semester_planner/* . 2>/dev/null || true
            cp -r semester_planner/.* . 2>/dev/null || true
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Patch missing files and code gaps
        run: |
          # 1. إنشاء شاشة معاينة الخطة المفقودة
          mkdir -p lib/presentation/screens/preview
          cat << 'EOF' > lib/presentation/screens/preview/plan_preview_screen.dart
          import 'package:flutter/material.dart';

          class PlanPreviewScreen extends StatelessWidget {
            final int planId;
            const PlanPreviewScreen({super.key, required this.planId});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('معاينة الخطة')),
                body: Center(child: Text('معاينة الخطة رقم $planId')),
              );
            }
          }
          EOF

          # 2. إنشاء شاشة الدروس المفقودة
          mkdir -p lib/presentation/screens/create_plan
          cat << 'EOF' > lib/presentation/screens/create_plan/step3_lessons_screen.dart
          import 'package:flutter/material.dart';

          class Step3LessonsScreen extends StatelessWidget {
            const Step3LessonsScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('إضافة الدروس')),
                body: const Center(child: Text('خطوة إضافة الدروس')),
              );
            }
          }
          EOF

          # 3. إضافة الاستدعاءات المفقودة في home_screen.dart
          sed -i '1i import "../../core/utils/app_utils.dart";\nimport "../../domain/providers/plan_providers.dart";\nimport "../../data/repositories/plan_repository.dart";\nimport "../preview/plan_preview_screen.dart";' lib/presentation/screens/home/home_screen.dart

          # 4. إضافة الاستدعاءات المفقودة في step2_units_screen.dart
          sed -i '1i import "step3_lessons_screen.dart";' lib/presentation/screens/create_plan/step2_units_screen.dart

          # 5. إضافة دالة copyWith الناقصة في UnitEntity
          cat << 'EOF' >> lib/domain/entities/plan_entity.dart

          extension UnitEntityExtension on UnitEntity {
            UnitEntity copyWith({
              int? id,
              int? planId,
              String? name,
              int? orderIndex,
              int? lessonCount,
            }) {
              return UnitEntity(
                id: id ?? this.id,
                planId: planId ?? this.planId,
                name: name ?? this.name,
                orderIndex: orderIndex ?? this.orderIndex,
                lessonCount: lessonCount ?? this.lessonCount,
              );
            }
          }
          EOF

      - name: Create main.dart if missing
        run: |
          if [ ! -f "lib/main.dart" ]; then
            cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'presentation/screens/splash/splash_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                title: 'Semester Planner',
                debugShowCheckedModeBanner: false,
                home: SplashScreen(),
              );
            }
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semester-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
