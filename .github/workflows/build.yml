name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o semester_planner.zip
          if [ -d "semester_planner" ]; then
            cp -r semester_planner/* . 2>/dev/null || true
            cp -r semester_planner/.* . 2>/dev/null || true
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Fix package versions compatibility
        run: |
          sed -i 's/intl:.*/intl: ^0.20.3/' pubspec.yaml

      - name: Create main.dart if missing
        run: |
          if [ ! -f "lib/main.dart" ]; then
            cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'presentation/screens/splash/splash_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                title: 'Semester Planner',
                debugShowCheckedModeBanner: false,
                home: SplashScreen(),
              );
            }
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semester-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
